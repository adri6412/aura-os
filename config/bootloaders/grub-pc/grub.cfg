if loadfont unicode; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-cyan
set color_normal=white/black

set timeout=15
set default=0

menuentry "AuraOS — Avvia" {
    linux   /live/vmlinuz boot=live components locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome hostname=auraos username=user quiet splash
    initrd  /live/initrd.img
}

menuentry "AuraOS — Installa" {
    linux   /live/vmlinuz boot=live components locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome hostname=auraos username=user quiet splash auraos.mode=install
    initrd  /live/initrd.img
}

menuentry "AuraOS — Avvia (toram: copia in RAM, per Intel N100 e USB lenti)" {
    linux   /live/vmlinuz boot=live components toram locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome hostname=auraos username=user quiet splash
    initrd  /live/initrd.img
}

menuentry "AuraOS — Installa (toram: copia in RAM, per Intel N100 e USB lenti)" {
    linux   /live/vmlinuz boot=live components toram locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome hostname=auraos username=user quiet splash auraos.mode=install
    initrd  /live/initrd.img
}

menuentry "Modalita' provvisoria (schermo problematico)" {
    linux   /live/vmlinuz boot=live components locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome nomodeset
    initrd  /live/initrd.img
}

menuentry "Compatibilita' hardware (Intel N100 / Alder Lake xHCI)" {
    linux   /live/vmlinuz boot=live components toram locales=it_IT.UTF-8 keyboard-layouts=it timezone=Europe/Rome hostname=auraos username=user intel_iommu=off iommu=soft usbcore.autosuspend=-1 pci=nomsi quiet splash
    initrd  /live/initrd.img
}

---
# Rimuove l'utente live 'user' dal sistema target prima di 'users'.
# chroot: true → i comandi girano nel sistema installato.
# Stringhe che iniziano con "-" → errori ignorati.
chroot: true
timeout: 60

script:
    # Termina processi utente live (sicurezza)
    - "-/usr/bin/pkill -u user"
    # Rimuove utente e home
    - "-/usr/sbin/userdel -r -f user"
    # Pulizia manuale in caso userdel fallisse
    - "-/bin/sed -i '/^user:/d' /etc/passwd"
    - "-/bin/sed -i '/^user:/d' /etc/shadow"
    - "-/bin/sed -i '/^user:/d' /etc/group"
    - "-/bin/sed -i '/^user:/d' /etc/gshadow"
    - "-/bin/rm -rf /home/user"
    # Rimuove autologin GDM se presente
    - "-/bin/sed -i '/AutomaticLogin/d' /etc/gdm3/custom.conf"
    - "-/bin/sed -i '/AutomaticLoginEnable/d' /etc/gdm3/custom.conf"
    # Rimuove sudoers live
    - "-/bin/rm -f /etc/sudoers.d/auraos"

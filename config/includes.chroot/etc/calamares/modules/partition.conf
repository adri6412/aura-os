---
# AuraOS — configurazione modulo partizione Calamares
#
# Modalità di default: "erase" (automatica) con layout fisso:
#   /boot/efi   800 MiB   FAT32     (solo UEFI)
#   /           20 GiB    ext4      sistema base (immutabile via overlay)
#   auraos-data spazio rimanente ext4  upper layer overlay persistente
#
# L'utente può comunque passare alla modalità manuale se vuole.

# Partizione EFI di sistema — creata automaticamente da Calamares
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: "800M"
efiSystemPartitionName: "EFI"

# Filesystem di default per le nuove partizioni
defaultFileSystemType: "ext4"

# Spazio minimo richiesto per l'installazione (GiB)
requiredStorage: 25.0

# Modalità partizione di default: erase = automatica (sovrascrive l'intero disco)
initialPartitioningChoice: "erase"

# Nessuno swap — usiamo zram a runtime
userSwapChoices:
    - none
initialSwapChoice: none

# Layout partizioni per la modalità automatica "erase"
# Le dimensioni fisse vengono allocate per prime; l'ultima voce con
# size: 100% prende tutto lo spazio rimanente.
partitionLayout:
    - filesystem: ext4
      mountPoint: /
      size: 20GiB
      name: "AuraOS"
      label: "AuraOS"

    - filesystem: ext4
      mountPoint: ""
      size: 100%
      name: "auraos-data"
      label: "auraos-data"

# Permette di tornare alla modalità manuale (utenti esperti)
allowManualPartitioning: true

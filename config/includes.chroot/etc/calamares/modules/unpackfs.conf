---
# unpackfs: copia il filesystem live (squashfs) sulla partizione di destinazione.
# live-boot monta il medium in /run/live/medium/; il filesystem è in live/.
#
# Se l'eccezione persiste, verificare il percorso con:
#   ls /run/live/medium/live/
# nella sessione live (terminale).
unpack:
    - source: /run/live/medium/live/filesystem.squashfs
      sourcefs: squashfs
      destination: ""

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%"   stop-color="#9ECEF8"/>
      <stop offset="100%" stop-color="#1A5CC8"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A5CC8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Cerchio principale con gradiente -->
  <circle cx="100" cy="100" r="88" fill="url(#grad)" filter="url(#shadow)"/>
  <!-- Anello sottile interno -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Lettera "a" minuscola stile macOS -->
  <text x="100" y="134" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="90" font-weight="200" fill="white" text-anchor="middle"
        letter-spacing="-2">a</text>
</svg>

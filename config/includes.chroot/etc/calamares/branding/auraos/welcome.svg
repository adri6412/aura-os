<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#87CEEB"/>
      <stop offset="55%"  stop-color="#C8E6F5"/>
      <stop offset="80%"  stop-color="#E8D5C4"/>
      <stop offset="100%" stop-color="#C4845A"/>
    </linearGradient>
    <radialGradient id="sun" cx="72%" cy="38%" r="20%">
      <stop offset="0%"   stop-color="#FFF5B0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD580" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6B8E60"/>
      <stop offset="100%" stop-color="#3D5C38"/>
    </linearGradient>
    <radialGradient id="logo-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%"   stop-color="#9ECEF8"/>
      <stop offset="100%" stop-color="#1A5CC8"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1A5CC8" flood-opacity="0.3"/></filter>
  </defs>

  <!-- Sfondo paesaggio macOS-style -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <ellipse cx="576" cy="190" rx="130" ry="130" fill="url(#sun)" filter="url(#blur)"/>
  <!-- Colline lontane -->
  <ellipse cx="100"  cy="420" rx="240" ry="100" fill="url(#hills)" opacity="0.6"/>
  <ellipse cx="380"  cy="435" rx="300" ry="95"  fill="url(#hills)" opacity="0.7"/>
  <ellipse cx="680"  cy="415" rx="260" ry="105" fill="url(#hills)" opacity="0.6"/>
  <!-- Colline primo piano -->
  <ellipse cx="80"   cy="490" rx="280" ry="120" fill="#4A6741"/>
  <ellipse cx="420"  cy="500" rx="380" ry="120" fill="#4A6741"/>
  <ellipse cx="730"  cy="492" rx="300" ry="118" fill="#4A6741"/>
  <rect x="0" y="460" width="800" height="40" fill="#3D5C38"/>

  <!-- Logo circolare centrato -->
  <circle cx="400" cy="210" r="68" fill="url(#logo-grad)" filter="url(#shadow)"/>
  <circle cx="400" cy="210" r="55" fill="none" stroke="white" stroke-width="1.2" opacity="0.35"/>
  <text x="400" y="244" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="70" font-weight="200" fill="white" text-anchor="middle">a</text>

  <!-- Testo -->
  <text x="400" y="320" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="38" font-weight="300" fill="#1A1A2E" text-anchor="middle" opacity="0.92">AuraOS</text>
  <text x="400" y="355" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="16" font-weight="300" fill="#2A2A4A" text-anchor="middle" opacity="0.7">Fast, clean, and secure Linux</text>
</svg>

# AuraOS — WirePlumber: periodo ALSA aumentato per VMware HD Audio
# api.alsa.period-size  : blocco minimo di dati che il driver DMA trasferisce
#                         per volta. 2048 campioni evita underrun nella VM.
# api.alsa.headroom     : campioni extra nel buffer per compensare la jitter
#                         del timer virtuale di VMware.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        api.alsa.period-size   = 2048
        api.alsa.headroom      = 8192
        api.alsa.disable-mmap  = true
      }
    }
  }
]

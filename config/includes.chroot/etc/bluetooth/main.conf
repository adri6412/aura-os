[General]
# Nome mostrato agli altri dispositivi
Name = AuraOS

# Classe del dispositivo: computer desktop generico
Class = 0x000100

# Abilita il controller BT automaticamente all'avvio di bluetoothd.
# Senza questo, il controller esiste ma rimane spento e nulla funziona.
AutoEnable = true

# Connessione rapida: riduce la latenza di pairing
FastConnectable = true

[Policy]
# Riconnette automaticamente i dispositivi trusted all'avvio
AutoEnable = true

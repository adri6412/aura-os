# AuraOS — PipeWire: buffer aumentato per ambienti VMware/VirtualBox
# Il quantum più alto (2048 campioni ≈ 42ms a 48kHz) elimina gli scatti audio
# causati dall'imprecisione dei timer nelle VM. Impercettibile per l'utente finale.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 1024
    default.clock.max-quantum   = 8192
}

# AuraOS — Fix audio a scatti su VMware Workstation (HD Audio virtuale)
#
# power_save=0          : disabilita il risparmio energetico del codec HDA
#                         (in VM causa silenzi/crepitii quando il dispositivo
#                          viene "sospeso" e risvegliato tra un suono e l'altro)
# power_save_controller=N : non spegnere il controller HDA, solo i codec
# bdl_pos_adj=0          : disabilita la correzione automatica della posizione
#                          nel buffer DMA (sorgente principale di scatti in VM)
options snd_hda_intel power_save=0 power_save_controller=N bdl_pos_adj=0

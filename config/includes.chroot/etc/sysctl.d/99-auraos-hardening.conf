# AuraOS — kernel hardening parameters
# Caricati automaticamente da systemd-sysctl al boot.

# ASLR massimo: randomizza layout memoria di stack, heap, librerie
kernel.randomize_va_space = 2

# Nasconde gli indirizzi kernel dai log (es. /proc/kallsyms) agli utenti non-root
kernel.kptr_restrict = 2

# Limita l'accesso a dmesg ai soli root
kernel.dmesg_restrict = 1

# Restringe ptrace: un processo può fare ptrace solo sui suoi figli diretti
# (previene process injection da processi non correlati)
kernel.yama.ptrace_scope = 2

# Disabilita SysRq magic keys (previene comandi di sistema da tastiera fisica)
kernel.sysrq = 0

# Limita i core dump: nessun dump per binari SUID
fs.suid_dumpable = 0

# Protezione contro attacchi TOCTOU via hardlink e symlink
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# TCP SYN cookies: protezione contro SYN flood
net.ipv4.tcp_syncookies = 1

# Ignora ping broadcast (Smurf attack)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Blocca ICMP redirect (previene manipolazione tabella di routing)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Blocca source routing (il mittente non può imporre il percorso dei pacchetti)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log pacchetti con source route o redirect (anomalie di rete)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# IP forwarding: necessario per VPN (Ivanti/Pulse) e Docker
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 0

# Reverse path filtering: scarta pacchetti con source address non raggiungibile
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignora ICMP echo request (il sistema non risponde ai ping — opzionale, commentare se necessario)
# net.ipv4.icmp_echo_ignore_all = 1

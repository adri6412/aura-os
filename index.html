<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraOS — Catalogo Profili</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 48px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 2rem; margin-bottom: 4px; }
    .sub { color: #666; margin-bottom: 32px; }
    .profile { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .profile h3 { margin: 0 0 4px; }
    .profile p { margin: 0; color: #555; font-size: 0.9rem; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px;
             border-radius: 12px; background: #e8f0fe; color: #1a56db; margin-top: 8px; }
    #error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>AuraOS</h1>
  <p class="sub">Catalogo profili di sistema — usato da AuraOS Manager</p>
  <div id="profiles"><p>Caricamento…</p></div>
  <p id="error"></p>

  <script>
    fetch('profiles/index.json')
      .then(r => r.json())
      .then(data => {
        const el = document.getElementById('profiles');
        el.innerHTML = '';
        data.profiles.forEach(p => {
          el.innerHTML += `
            <div class="profile">
              <h3>${p.name}</h3>
              <p>${p.description}</p>
              <span class="badge">${p.category}</span>
              ${p.default ? '<span class="badge" style="background:#e6f9f0;color:#157347">Default</span>' : ''}
            </div>`;
        });
      })
      .catch(e => document.getElementById('error').textContent = 'Errore: ' + e);
  </script>
</body>
</html>
